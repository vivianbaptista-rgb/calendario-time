<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; padding: 2rem 1.5rem; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .title { font-size: 26px; font-weight: 600; color: #0f172a; }
  .nav-group { display: flex; gap: 8px; align-items: center; }
  .nav-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 16px; font-size: 14px; color: #334155; cursor: pointer; transition: background 0.15s; }
  .nav-btn:hover { background: #f1f5f9; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748b; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .weekdays { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-bottom: 4px; }
  .wd { font-size: 12px; font-weight: 600; color: #64748b; text-align: center; padding: 6px 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }

  .day { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 96px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .day.empty { background: #f8fafc; border-color: transparent; pointer-events: none; }
  .day.today { border-color: #3b82f6; border-width: 2px; background: #eff6ff; }

  .day.has-info  { border-left: 3px solid #3b82f6; }
  .day.has-done  { border-left: 3px solid #10b981; }
  .day.has-warn  { border-left: 3px solid #f59e0b; }
  .day.has-urg   { border-left: 3px solid #ef4444; }
  .day.has-viv   { border-left: 3px solid #8b5cf6; }

  .day-num { font-size: 13px; font-weight: 600; color: #64748b; }
  .today .day-num { background: #3b82f6; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  .day-note-preview { font-size: 12px; color: #334155; }

  .day-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; margin-top: auto; }

  .tag-info  { background: #dbeafe; color: #1e40af; }
  .tag-done  { background: #d1fae5; color: #065f46; }
  .tag-warn  { background: #fef3c7; color: #92400e; }
  .tag-urg   { background: #fee2e2; color: #991b1b; }
  .tag-viv   { background: #ede9fe; color: #5b21b6; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
  .overlay.open { display: flex; }

  .modal { background: #fff; padding: 1.5rem; border-radius: 12px; width: 320px; }

  .tag-btn { padding: 5px 10px; border-radius: 20px; border: 1px solid #ddd; cursor: pointer; }

  .tag-btn.sel-info { background: #dbeafe; }
  .tag-btn.sel-done { background: #d1fae5; }
  .tag-btn.sel-warn { background: #fef3c7; }
  .tag-btn.sel-urg  { background: #fee2e2; }
  .tag-btn.sel-viv  { background: #ede9fe; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title" id="cal-title"></div>

    <div>
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:#3b82f6"></div>Afiliados PJ</div>
        <div class="leg"><div class="leg-dot" style="background:#10b981"></div>Afiliados PF</div>
        <div class="leg"><div class="leg-dot" style="background:#f59e0b"></div>Pendente</div>
        <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Urgente</div>
        <div class="leg"><div class="leg-dot" style="background:#8b5cf6"></div>Vivian</div>
      </div>

      <div class="nav-group">
        <button onclick="changeMonth(-1)">←</button>
        <button onclick="goToday()">Hoje</button>
        <button onclick="changeMonth(1)">→</button>
      </div>
    </div>
  </div>

  <div class="grid" id="cal-grid"></div>
</div>

<div class="overlay" id="overlay"></div>

<script>
const TAGS = [
  {id:'info', label:'Afiliados PJ'},
  {id:'done', label:'Afiliados PF'},
  {id:'warn', label:'Pendente'},
  {id:'urg', label:'Urgente'},
  {id:'viv', label:'Vivian'}
];

const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();
let data = JSON.parse(localStorage.getItem('cal_data') || '{}');

function key(y,m,d){ return `${y}-${m}-${d}`; }

function render(){
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const days = new Date(viewY, viewM+1, 0).getDate();

  for(let d=1; d<=days; d++){
    const k = key(viewY, viewM, d);
    const entry = data[k] || {};

    const cell = document.createElement('div');
    cell.className = 'day ' + (entry.tag ? 'has-'+entry.tag : '');

    cell.innerHTML = `<div>${d}</div>`;

    if(entry.tag){
      const t = TAGS.find(x=>x.id===entry.tag);
      cell.innerHTML += `<span class="day-tag tag-${entry.tag}">${t.label}</span>`;
    }

    grid.appendChild(cell);
  }
}

function changeMonth(d){ viewM+=d; render(); }
function goToday(){ viewM=now.getMonth(); viewY=now.getFullYear(); render(); }

render();
</script>

</body>
</html>
