<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; padding: 2rem 1.5rem; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .title { font-size: 26px; font-weight: 600; color: #0f172a; }
  .nav-group { display: flex; gap: 8px; align-items: center; }
  .nav-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 16px; font-size: 14px; color: #334155; cursor: pointer; transition: background 0.15s; }
  .nav-btn:hover { background: #f1f5f9; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748b; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .weekdays { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-bottom: 4px; }
  .wd { font-size: 12px; font-weight: 600; color: #64748b; text-align: center; padding: 6px 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
  .day { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 96px; padding: 8px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; gap: 4px; }
  .day:hover { border-color: #94a3b8; }
  .day.empty { background: #f8fafc; border-color: transparent; cursor: default; pointer-events: none; }
  .day.today { border-color: #3b82f6; border-width: 2px; background: #eff6ff; }

  .day.has-info  { border-left: 3px solid #3b82f6; border-radius: 0 8px 8px 0; }
  .day.has-done  { border-left: 3px solid #10b981; border-radius: 0 8px 8px 0; }
  .day.has-warn  { border-left: 3px solid #f59e0b; border-radius: 0 8px 8px 0; }
  .day.has-urg   { border-left: 3px solid #ef4444; border-radius: 0 8px 8px 0; }
  .day.has-viv   { border-left: 3px solid #8b5cf6; border-radius: 0 8px 8px 0; }

  .day-num { font-size: 13px; font-weight: 600; color: #64748b; }
  .today .day-num { background: #3b82f6; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  .day-note-preview { font-size: 12px; color: #334155; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; flex: 1; }

  .day-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; display: inline-block; margin-top: auto; align-self: flex-start; font-weight: 500; }
  .tag-info  { background: #dbeafe; color: #1e40af; }
  .tag-done  { background: #d1fae5; color: #065f46; }
  .tag-warn  { background: #fef3c7; color: #92400e; }
  .tag-urg   { background: #fee2e2; color: #991b1b; }
  .tag-viv   { background: #ede9fe; color: #5b21b6; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 340px; border: 1px solid #e2e8f0; }
  .modal-title { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 12px; }
  .modal textarea { width: 100%; font-size: 14px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; min-height: 80px; resize: vertical; font-family: inherit; color: #0f172a; line-height: 1.5; }
  .modal textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .modal-tag-label { font-size: 12px; color: #64748b; margin: 12px 0 6px; }
  .tag-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-btn { font-size: 12px; padding: 5px 14px; border-radius: 99px; cursor: pointer; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; transition: all 0.15s; }
  .tag-btn:hover { border-color: #94a3b8; }
  .tag-btn.sel-info { background: #dbeafe; color: #1e40af; border-color: #3b82f6; }
  .tag-btn.sel-done { background: #d1fae5; color: #065f46; border-color: #10b981; }
  .tag-btn.sel-warn { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
  .tag-btn.sel-urg  { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
  .tag-btn.sel-viv  { background: #ede9fe; color: #5b21b6; border-color: #8b5cf6; }

  .modal-actions { display: flex; justify-content: space-between; margin-top: 16px; align-items: center; }
  .btn-clear { font-size: 12px; color: #94a3b8; background: none; border: none; cursor: pointer; padding: 4px; }
  .btn-clear:hover { color: #ef4444; }
  .btn-group { display: flex; gap: 8px; }
  .btn { font-size: 14px; padding: 8px 20px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; color: #334155; cursor: pointer; transition: background 0.15s; }
  .btn:hover { background: #f1f5f9; }
  .btn.save { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .btn.save:hover { background: #2563eb; }

  @media (max-width: 600px) {
    body { padding: 1rem; }
    .day { min-height: 64px; padding: 6px; }
    .day-note-preview { -webkit-line-clamp: 1; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title" id="cal-title"></div>

    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:#3b82f6"></div>Afiliados PJ</div>
        <div class="leg"><div class="leg-dot" style="background:#10b981"></div>Afiliados PF</div>
        <div class="leg"><div class="leg-dot" style="background:#f59e0b"></div>Pendente</div>
        <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Urgente</div>
        <div class="leg"><div class="leg-dot" style="background:#8b5cf6"></div>Vivian</div>
      </div>

      <div class="nav-group">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
        <button class="nav-btn" onclick="goToday()">Hoje</button>
        <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
      </div>
    </div>
  </div>

  <div class="weekdays">
    <div class="wd">Dom</div><div class="wd">Seg</div><div class="wd">Ter</div>
    <div class="wd">Qua</div><div class="wd">Qui</div><div class="wd">Sex</div><div class="wd">Sáb</div>
  </div>

  <div class="grid" id="cal-grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <textarea id="modal-note"></textarea>

    <div class="modal-tag-label">Etiqueta</div>
    <div class="tag-btns" id="tag-btns"></div>

    <div class="modal-actions">
      <button class="btn-clear" onclick="clearEntry()">Apagar dia</button>
      <div class="btn-group">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn save" onclick="saveModal()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const TAGS = [
  {id:'info', label:'Afiliados PJ', selCls:'sel-info', tagCls:'tag-info'},
  {id:'done', label:'Afiliados PF', selCls:'sel-done', tagCls:'tag-done'},
  {id:'warn', label:'Pendente', selCls:'sel-warn', tagCls:'tag-warn'},
  {id:'urg', label:'Urgente', selCls:'sel-urg', tagCls:'tag-urg'},
  {id:'viv', label:'Vivian', selCls:'sel-viv', tagCls:'tag-viv'}
];

const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();
let data = JSON.parse(localStorage.getItem('cal_data') || '{}');
let editKey = null, editTag = null;

function key(y,m,d){ return `${y}-${m}-${d}`; }
function save(){ localStorage.setItem('cal_data', JSON.stringify(data)); }

function render(){
  document.getElementById('cal-title').textContent = MONTHS[viewM] + ' ' + viewY;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstDay = new Date(viewY, viewM, 1).getDay();
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
  const todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());

  for(let i=0; i<firstDay; i++){
    const e = document.createElement('div'); e.className='day empty'; grid.appendChild(e);
  }

  for(let d=1; d<=daysInMonth; d++){
    const k = key(viewY, viewM, d);
    const entry = data[k] || {};

    const cell = document.createElement('div');
    let cls = 'day';
    if(k === todayKey) cls += ' today';
    if(entry.tag) cls += ' has-'+entry.tag;
    cell.className = cls;
    cell.onclick = () => openModal(d, k);

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    cell.appendChild(numEl);

    if(entry.note){
      const np = document.createElement('div');
      np.className = 'day-note-preview';
      np.textContent = entry.note;
      cell.appendChild(np);
    }

    if(entry.tag){
      const t = TAGS.find(x=>x.id===entry.tag);
      if(t){
        const pill = document.createElement('span');
        pill.className = 'day-tag ' + t.tagCls;
        pill.textContent = t.label;
        cell.appendChild(pill);
      }
    }

    grid.appendChild(cell);
  }
}

function openModal(d, k){
  editKey = k;
  const entry = data[k] || {};
  editTag = entry.tag || null;

  document.getElementById('modal-title').textContent = d + ' de ' + MONTHS[viewM] + ' de ' + viewY;
  document.getElementById('modal-note').value = entry.note || '';

  const tb = document.getElementById('tag-btns');
  tb.innerHTML = '';

  TAGS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tag-btn' + (editTag===t.id ? ' '+t.selCls : '');
    b.textContent = t.label;

    b.onclick = () => {
      editTag = editTag===t.id ? null : t.id;
      document.querySelectorAll('.tag-btn').forEach((btn,i) => {
        btn.className = 'tag-btn' + (editTag===TAGS[i].id ? ' '+TAGS[i].selCls : '');
      });
    };

    tb.appendChild(b);
  });

  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editKey = null;
}

function clearEntry(){
  if(editKey){
    delete data[editKey];
    save();
  }
  closeModal();
  render();
}

function saveModal(){
  if(!editKey) return;

  const note = document.getElementById('modal-note').value.trim();

  if(note || editTag){
    data[editKey] = {note, tag: editTag};
  } else {
    delete data[editKey];
  }

  save();
  closeModal();
  render();
}

function changeMonth(d){
  viewM += d;
  if(viewM > 11){ viewM = 0; viewY++; }
  if(viewM < 0){ viewM = 11; viewY--; }
  render();
}

function goToday(){
  viewY = now.getFullYear();
  viewM = now.getMonth();
  render();
}

document.getElementById('overlay').onclick = e => {
  if(e.target === document.getElementById('overlay')) closeModal();
};

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
